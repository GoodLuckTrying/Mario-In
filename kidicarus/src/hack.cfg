MEMORY {
    BANK8: start=$8000, size=$4000, file="build/bank8.bin", fill=yes, fillval=$FF;
    WRAM: start=$6100, size=$0700, file="";
    SCROLLRAM: start=$6A00, size=$0300, file="";
    VBLANKRAM: start=$6E00, size=$0100, file="";
    FIXED: start=$CD9E, size=$00A0, file="build/boot.bin", fill=yes, fillval=$EA;
}
SEGMENTS {
    CODE: load=BANK8, type=ro, start=$8000;
    ASSETS: load=BANK8, type=ro, start=$A000;
    BRIDGES: load=BANK8, run=WRAM, type=rw, start=$6100, define=yes;
    SCROLL: load=BANK8, run=SCROLLRAM, type=rw, start=$6A00, define=yes;
    VBLANK: load=BANK8, run=VBLANKRAM, type=rw, start=$6E00, define=yes;
    BOOT: load=FIXED, type=ro, start=$CD9E;
}
